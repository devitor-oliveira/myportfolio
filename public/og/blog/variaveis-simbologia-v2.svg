<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="titulo descricao">
	<title id="titulo">Variáveis e simbologia</title>
	<desc id="descricao">Capa de blog introdutório com uma representação didática de nome e valor: a variável nome guarda o texto &quot;Vitor&quot;.</desc>
	<!-- Tokens: surface, surface-container, on-surface, on-surface-variant e primary. Exportar com as fontes oficiais disponíveis no Fontconfig: Space Grotesk 700, Inter 400 e Geist Mono 400. -->
	<rect width="1200" height="630" fill="#15121a"/>
	<text x="88" y="112" font-family="Geist Mono" font-weight="400" font-size="32" fill="#b2c5ff">Blog</text>
	<g font-family="Space Grotesk" font-size="72" font-weight="700" letter-spacing="-1.5" fill="#e7e0eb">
		<text x="88" y="212">Variáveis</text>
		<text x="88" y="300">e simbologia</text>
	</g>
	<text x="88" y="356" font-family="Inter" font-weight="400" font-size="34" fill="#c3c6d6">Conceitos básicos de programação</text>
	<rect x="88" y="404" width="648" height="84" rx="12" fill="#211e26"/>
	<path d="M382 422v48" stroke="#b2c5ff" stroke-width="3"/>
	<g font-family="Geist Mono" font-weight="400" font-size="42" text-anchor="middle">
		<text x="235" y="460" fill="#b2c5ff">nome</text>
		<text x="559" y="460" fill="#e7e0eb">&quot;Vitor&quot;</text>
	</g>
	<text x="88" y="560" font-family="Geist Mono" font-weight="400" font-size="32" fill="#e7e0eb">vitorhugodev.com</text>
</svg>
